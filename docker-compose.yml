name: cadencia

# Local development infrastructure. Every port binds to 127.0.0.1 only, so
# nothing is reachable from the network. Production uses managed services.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      CADENCIA_OWNER_PASSWORD: ${CADENCIA_OWNER_PASSWORD:?set in .env}
      CADENCIA_APP_PASSWORD: ${CADENCIA_APP_PASSWORD:?set in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5442}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6389}:6379"]
    volumes: [redisdata:/data]

  storage:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/init/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    ports: ["127.0.0.1:${S3_PORT:-8333}:8333"]
    volumes:
      - storagedata:/data
      - ./docker/seaweedfs/entrypoint.sh:/init/entrypoint.sh:ro

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  redisdata:
  storagedata:
